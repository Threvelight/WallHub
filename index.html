<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WallHub" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>WallHub</title>
    <script>
      // Safety net: if the app fails to start, show what went wrong and a way
      // to reset instead of a blank screen.
      (function () {
        var errors = []
        function note(msg) { if (msg && errors.length < 5) errors.push(String(msg)) }
        addEventListener('error', function (e) {
          note(e.message ? e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '') : 'Failed to load ' + ((e.target && (e.target.src || e.target.href)) || 'a file'))
        }, true)
        addEventListener('unhandledrejection', function (e) { note(e.reason && (e.reason.stack || e.reason.message || e.reason)) })
        window.__wallhubErrors = errors
        window.__wallhubReset = function () {
          var jobs = []
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }))
          Promise.all(jobs).catch(function () {}).then(function () { location.replace('/') })
        }
        window.__wallhubFatal = function (detail) {
          var root = document.getElementById('root')
          if (!root) return
          var box = document.createElement('div')
          box.style.cssText = 'max-width:520px;margin:15vh auto 0;padding:24px;font:16px/1.4 -apple-system,system-ui,sans-serif;color:#1d2420;background:#fff;border-radius:14px;text-align:left'
          box.innerHTML = '<h2 style="margin:0 0 8px">WallHub couldn\u2019t start</h2><p style="margin:0 0 12px">Tap the button to reset the app on this device. Your list is safe.</p>'
          var btn = document.createElement('button')
          btn.textContent = 'Reset and reload'
          btn.style.cssText = 'font:inherit;padding:12px 18px;border:0;border-radius:10px;background:#2f6f4f;color:#fff'
          btn.onclick = window.__wallhubReset
          var pre = document.createElement('pre')
          pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;font-size:12px;color:#6b726d;margin:16px 0 0'
          pre.textContent = (detail || errors.join('\n\n') || 'No error was reported.') + '\n\n' + navigator.userAgent
          box.appendChild(btn)
          box.appendChild(pre)
          root.replaceChildren(box)
        }
        addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && !root.childElementCount) window.__wallhubFatal()
          }, 4000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
